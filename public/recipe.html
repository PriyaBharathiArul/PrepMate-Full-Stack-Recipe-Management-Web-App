<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe — Saveur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="stylesheets/main.css"/>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="index.html" class="logo">Saveur</a>
      </div>
      <div class="header-center">
        <nav class="main-nav">
          <a href="index.html" class="nav-link">Home</a>
        </nav>
      </div>
      <div class="header-right" id="headerRight"></div>
    </div>
  </header>

  <main class="recipe-detail-page">
    <div class="recipe-detail-container" id="recipeDetailContainer">
      <!-- Populated by JS -->
    </div>

    <!-- REVIEWS SECTION -->
    <section class="reviews-section" id="reviewsSection">
      <div class="reviews-inner">
        <h2 class="section-title">Reviews</h2>
        <div class="reviews-list" id="reviewsList"></div>

        <!-- Review Form (only shown when logged in) -->
        <div class="review-form-wrap" id="reviewFormWrap" style="display:none">
          <h3>Leave a Review</h3>
          <div class="star-picker" id="starPicker">
            <span class="star" data-val="1">★</span>
            <span class="star" data-val="2">★</span>
            <span class="star" data-val="3">★</span>
            <span class="star" data-val="4">★</span>
            <span class="star" data-val="5">★</span>
          </div>
          <textarea id="reviewText" placeholder="Share your experience with this recipe…"></textarea>
          <button class="btn-primary" id="submitReview">Post Review</button>
        </div>
        <div id="loginToReview" class="login-prompt" style="display:none">
          <a href="#" id="loginToReviewLink">Log in</a> to leave a review or like this recipe.
        </div>
      </div>
    </section>
  </main>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="loginModal" style="display:none">
    <div class="modal">
      <button class="modal-close" id="closeModal">✕</button>
      <h2>Welcome back</h2>
      <p class="modal-sub">Sign in to like, review & create recipes.</p>
      <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" required/>
        <input type="password" id="loginPassword" placeholder="Password" required/>
        <button type="submit" class="btn-primary full">Sign In</button>
      </form>
      <p class="modal-footer-text">Don't have an account? <a href="#" id="switchToRegister">Register</a></p>
    </div>
  </div>

  <script src="javascripts/utils.js"></script>
  <script src="javascripts/recipe.js"></script>
</body>
</html>
